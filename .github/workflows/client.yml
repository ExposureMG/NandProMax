name: client

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: nandpromax
            out_ext: ""
            cargo_flags: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: nandpromax
            out_ext: ""
            cargo_flags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: nandpromax.exe
            out_ext: ".exe"
            cargo_flags: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: nandpromax.exe
            out_ext: ".exe"
            cargo_flags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: nandpromax
            out_ext: ""
            cargo_flags: "--no-default-features --features libftdi"
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: nandpromax
            out_ext: ""
            cargo_flags: "--no-default-features --features libftdi"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux deps & libftd2xx
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config ca-certificates curl unzip
          bash scripts/install_libftd2xx.sh

      - name: Install libftd2xx (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install_libftd2xx.ps1 -OutDir "target/${{ matrix.target }}/release"

      - name: Install macOS deps (libftdi)
        if: runner.os == 'macOS'
        run: |
          brew install libftdi pkg-config libusb

      - name: Build
        env:
          LIBRARY_PATH: /usr/local/lib
          LD_LIBRARY_PATH: /usr/local/lib
          DYLD_LIBRARY_PATH: /usr/local/lib
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/nandpromax-${{ matrix.target }}${{ matrix.out_ext }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -f "target/${{ matrix.target }}/release/ftd2xx.dll" ]]; then
              cp "target/${{ matrix.target }}/release/ftd2xx.dll" "dist/ftd2xx.dll"
            elif [[ -f "target/${{ matrix.target }}/release/libftd2xx.dll" ]]; then
              cp "target/${{ matrix.target }}/release/libftd2xx.dll" "dist/libftd2xx.dll"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nandpromax-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f -maxdepth 3 -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
