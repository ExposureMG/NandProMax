[package]
name = "nandpromax"
version = "0.0.1"
edition = "2021"

[lib]
name = "nandpromax"
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
cc = "1.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4"
rusb = "0.9"
libc = "0.2"
eh0 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
eh1 = { package = "embedded-hal", version = "1" }
ehnb1 = { package = "embedded-hal-nb", version = "1" }
